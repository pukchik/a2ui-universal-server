name: CI
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: node:24-bookworm@sha256:3d27e5c11e5786e309ec3e03f93ae536eb36e6e5eb3714d5eb3300a36157add0
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      - name: Checkout requested commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record tested commit
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Install pinned pnpm
        run: npm install --global pnpm@12.14.0
      - name: Restore pnpm downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /tmp/a2ui-ci-pnpm-store
          key: a2ui-uniserver-${{ runner.os }}-${{ runner.arch }}-node24.21.0-pnpm12.14.0-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --store-dir /tmp/a2ui-ci-pnpm-store
      - name: Check formatting and shell syntax
        run: |
          pnpm format:check
          bash -n scripts/test-ci.sh
      - name: Check TypeScript
        run: pnpm check
      - name: Install PostgreSQL 18 inside the job
        run: |
          set -eu
          install -d /usr/share/postgresql-common/pgdg
          curl -fsS --retry 3 https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          printf '%s\n' 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt bookworm-pgdg main' > /etc/apt/sources.list.d/pgdg.list
          if [ ! -e /usr/sbin/policy-rc.d ]; then
            printf '#!/bin/sh\nexit 101\n' > /usr/sbin/policy-rc.d
            chmod +x /usr/sbin/policy-rc.d
          fi
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends postgresql-18
      - name: Run all tests with a private PostgreSQL cluster
        run: pnpm test:ci

  build:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: node:24-bookworm@sha256:3d27e5c11e5786e309ec3e03f93ae536eb36e6e5eb3714d5eb3300a36157add0
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.tests.outputs.sha }}
          persist-credentials: false
      - name: Verify tested revision
        env:
          EXPECTED_SHA: ${{ needs.tests.outputs.sha }}
        run: test -n "$EXPECTED_SHA" && test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install pinned pnpm
        run: npm install --global pnpm@12.14.0
      - name: Restore pnpm downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /tmp/a2ui-ci-pnpm-store
          key: a2ui-uniserver-${{ runner.os }}-${{ runner.arch }}-node24.21.0-pnpm12.14.0-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --store-dir /tmp/a2ui-ci-pnpm-store
      - name: Build production client
        run: pnpm build

  deploy:
    needs: [tests, build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: node:24-bookworm@sha256:3d27e5c11e5786e309ec3e03f93ae536eb36e6e5eb3714d5eb3300a36157add0
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.tests.outputs.sha }}
          persist-credentials: false
      - name: Verify tested revision
        env:
          EXPECTED_SHA: ${{ needs.tests.outputs.sha }}
        run: test -n "$EXPECTED_SHA" && test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Read current deployment contract
        run: curl -fsS http://127.0.0.1:8091/deploy-docs/DEPLOYMENT.md
      - name: Install pinned pnpm
        run: npm install --global pnpm@12.14.0
      - name: Restore pnpm downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /tmp/a2ui-ci-pnpm-store
          key: a2ui-uniserver-${{ runner.os }}-${{ runner.arch }}-node24.21.0-pnpm12.14.0-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --store-dir /tmp/a2ui-ci-pnpm-store
      - name: Build prefixed demo and prepare deployment sources
        env:
          BASE_PATH: /test/a2ui-uniserver/
        run: |
          pnpm build
          node scripts/prepare-demo.ts
      - name: Publish demo through the deployment gateway
        env:
          STRAZH_DEPLOY_TOKEN: ${{ secrets.STRAZH_DEPLOY_TOKEN }}
        run: |
          test -n "$STRAZH_DEPLOY_TOKEN"
          curl -fsS http://127.0.0.1:8091/deploy-docs/client.mjs -o /tmp/strazh-deploy.mjs
          node /tmp/strazh-deploy.mjs publish a2ui-uniserver strazh.deploy.json
      - name: Smoke test deployed revision and form action
        env:
          SMOKE_URL: http://127.0.0.1:8091/test/a2ui-uniserver/
          SMOKE_ORIGIN: https://home.eralas.ru
          EXPECTED_SHA: ${{ needs.tests.outputs.sha }}
        run: node scripts/smoke-demo.ts
